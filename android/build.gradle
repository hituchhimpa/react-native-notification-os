buildscript {
    ext.safeExtGet = { prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '1.9.0')}"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.rnnos'
    compileSdkVersion safeExtGet('compileSdkVersion', 34)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 23)
        targetSdkVersion safeExtGet('targetSdkVersion', 34)
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
}

def resolveReactNativeVersion() {
    if (rootProject.ext.has('reactNativeVersion')) {
        return rootProject.ext.get('reactNativeVersion')
    }
    try {
        def rnPackageJson = file("${rootProject.projectDir}/../node_modules/react-native/package.json")
        if (rnPackageJson.exists()) {
            def parsed = new groovy.json.JsonSlurper().parseText(rnPackageJson.text)
            return parsed.version
        }
    } catch (Exception ignored) {}
    try {
        def rnPackageJson = file("${projectDir}/../../react-native/package.json")
        if (rnPackageJson.exists()) {
            def parsed = new groovy.json.JsonSlurper().parseText(rnPackageJson.text)
            return parsed.version
        }
    } catch (Exception ignored) {}
    return "0.73.6"
}

dependencies {
    // ─── React Native: compileOnly so host app's version is used ────────────
    def rnVersion = resolveReactNativeVersion()
    compileOnly "com.facebook.react:react-android:$rnVersion"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet('kotlinVersion', '1.9.0')}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // AndroidX & Jetpack Libraries
    implementation "androidx.core:core-ktx:1.13.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    // Firebase Messaging
    implementation "com.google.firebase:firebase-messaging:24.0.0"
}
